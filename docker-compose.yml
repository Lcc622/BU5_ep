services:
  backend:
    build: ./backend
    ports:
      - "8002:8000"
    volumes:
      - ./backend/app:/app/app
      - ./backend/uploads:/app/uploads
      - ./backend/results:/app/results
      - ./backend/data:/app/data
      - ./templates:/app/templates
    environment:
      - CORS_ORIGINS=http://localhost:5180,http://localhost:3000
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "5180:80"
    depends_on:
      - backend
    restart: unless-stopped
